name: Power Agent MCP - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '10.0.x'

jobs:
  # Continuous Integration
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install Dependencies
      run: |
        npm ci
    
    - name: Lint Code
      run: |
        npm run lint
    
    - name: Build Application
      run: |
        npm run build
    
    - name: Run Tests
      run: |
        npm test
    
    - name: Validate MCP Server
      run: |
        node -e "import('./dist/mcp/tools/handler.js').then(m => { const h = new m.PowerPlatformToolHandler(); const tools = h.getAllTools(); if (tools.length !== 253) throw new Error('Expected 253 MCP tools, found ' + tools.length); console.log('MCP tool inventory validated: ' + tools.length); })"
    
    - name: Security Scan
      run: npm audit --audit-level=high
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          docs/
          deployment/
        retention-days: 30

  # Package Creation
  package:
    name: Create Packages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install VSCE
      run: npm install -g @vscode/vsce

    - name: Build Canonical MCP Server
      run: |
        npm ci
        npm run build
        rm -rf deployment/vscode-extension/server
        mkdir -p deployment/vscode-extension/server
        cp -R dist/mcp deployment/vscode-extension/server/mcp
        rm -rf deployment/nuget-package/dist
        mkdir -p deployment/nuget-package/dist
        cp -R dist/mcp deployment/nuget-package/dist/mcp
    
    - name: Create VSCode Extension Package
      run: |
        cd deployment/vscode-extension
        npm ci
        npm run compile
        vsce package --out ../../power-agent-mcp.vsix
    
    - name: Create NuGet Package
      run: |
        cd deployment/nuget-package
        nuget pack DarBotLabs.PowerAgent.MCP.nuspec
    
    - name: Upload Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: |
          *.vsix
          deployment/nuget-package/*.nupkg
        retention-days: 90

  # Release Management
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ci, package]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download Packages
      uses: actions/download-artifact@v4
      with:
        name: packages
    
    - name: Create Release Notes
      id: release-notes
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        # Create release notes
        cat > release-notes.md << EOF
        # Power Agent MCP v$VERSION
        
        ## What's New
        - 253 specialized tools for Power Platform automation
        - Native Dataverse integration with 25 dedicated operations
        - SQL Server integration with 7 database management tools
        - Adaptive Cards SDK with 10 Copilot Studio tools
        - Enterprise authentication support
        
        ## Installation
        
        ### VSCode Extension
        Download and install the \`.vsix\` file from the assets below.
        
        ### NuGet Package
        \`\`\`
        Install-Package DarBotLabs.PowerAgent.MCP
        \`\`\`
        
        ## Documentation
        - [Setup Guide](https://github.com/dayour/Power-Agent-MCP/blob/main/docs/MCP_CONNECTOR_SETUP.md)
        - [API Reference](https://github.com/dayour/Power-Agent-MCP/blob/main/power-mcp.md)
        - [Production Deployment](https://github.com/dayour/Power-Agent-MCP/blob/main/docs/PRODUCTION_DEPLOYMENT_CHECKLIST.md)
        EOF
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Power Agent MCP v${{ steps.release-notes.outputs.VERSION }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          *.vsix
          deployment/nuget-package/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci, package]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
    
    - name: Deploy to Production Server
      run: |
        chmod +x deployment/production-setup/deploy-production.sh
        deployment/production-setup/deploy-production.sh production
      env:
        POWERPLATFORM_TENANT_ID: ${{ secrets.POWERPLATFORM_TENANT_ID }}
        POWERPLATFORM_APPLICATION_ID: ${{ secrets.POWERPLATFORM_APPLICATION_ID }}
        POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}

  # Publish to Marketplaces
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    needs: [ci, package, release]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: marketplace
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Download Packages
      uses: actions/download-artifact@v4
      with:
        name: packages
    
    - name: Publish VSCode Extension
      run: |
        vsce publish --packagePath *.vsix
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
    
    - name: Publish NuGet Package
      run: |
        dotnet nuget push deployment/nuget-package/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
